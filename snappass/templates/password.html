{% extends "base.html" %}

{% block content %}
<div class="card">
  <h1>Your secret</h1>
  <p class="subtitle">Copy it now. It has already been deleted from the server.</p>

  <textarea class="textarea-mono" rows="6" id="password-text" readonly>{{ password }}</textarea>

  <div style="display:flex; gap:0.5rem; margin-top:1rem;">
    <button type="button" class="btn btn-copy" id="copy-btn" onclick="copySecret()" style="flex:1;">
      <svg id="copy-icon" width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="5.5" y="5.5" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.2"/><path d="M3.5 10.5h-.25a1.25 1.25 0 0 1-1.25-1.25v-6a1.25 1.25 0 0 1 1.25-1.25h6a1.25 1.25 0 0 1 1.25 1.25v.25" stroke="currentColor" stroke-width="1.2"/></svg>
      <span id="copy-label">Copy to clipboard</span>
    </button>
  </div>

  <div class="deleted-notice">
    <div class="info-box info-success" style="text-align:left;">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6.5" stroke="currentColor" stroke-width="1.2"/><path d="M5.5 8.25l1.75 1.75 3.25-3.75" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>This secret has been permanently deleted. The link is now dead.</span>
    </div>
  </div>

  <a href="/" class="link-muted">Share a new secret</a>
</div>
{% endblock %}

{% block js %}
<script>
function copySecret() {
  var textarea = document.getElementById('password-text');
  var btn = document.getElementById('copy-btn');
  var label = document.getElementById('copy-label');
  var icon = document.getElementById('copy-icon');

  navigator.clipboard.writeText(textarea.value).then(function() {
    btn.classList.add('copied');
    icon.innerHTML = '<polyline points="4,8.5 7,11.5 12,5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>';
    label.textContent = 'Copied!';
    setTimeout(function() {
      btn.classList.remove('copied');
      icon.innerHTML = '<rect x="5.5" y="5.5" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.2"/><path d="M3.5 10.5h-.25a1.25 1.25 0 0 1-1.25-1.25v-6a1.25 1.25 0 0 1 1.25-1.25h6a1.25 1.25 0 0 1 1.25 1.25v.25" stroke="currentColor" stroke-width="1.2"/>';
      label.textContent = 'Copy to clipboard';
    }, 2000);
  }).catch(function() {
    textarea.select();
    document.execCommand('copy');
    btn.classList.add('copied');
    label.textContent = 'Copied!';
    setTimeout(function() {
      btn.classList.remove('copied');
      label.textContent = 'Copy to clipboard';
    }, 2000);
  });
}
</script>
{% endblock %}
