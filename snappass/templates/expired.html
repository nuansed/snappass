{% extends "base.html" %}

{% block content %}
<div class="card">
  <div style="text-align:center; margin-bottom:1.5rem;">
    <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
      <circle cx="24" cy="24" r="24" fill="rgba(239,68,68,0.12)"/>
      <path d="M24 15a5 5 0 0 0-5 5v3h-1a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2h-1v-3a5 5 0 0 0-5-5zm-2.5 8v-3a2.5 2.5 0 0 1 5 0v3h-5z" fill="#ef4444"/>
      <line x1="17" y1="17" x2="31" y2="31" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
    </svg>
  </div>

  <h1 style="text-align:center;">Secret not found</h1>
  <p class="subtitle" style="text-align:center;">This link no longer contains a secret.</p>

  <div class="info-box info-danger">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6.5" stroke="currentColor" stroke-width="1.2"/><path d="M8 5v3.5M8 10.5v.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
    <span>It may have already been viewed, expired, or never existed. If someone sent you this link, ask them to create a new one.</span>
  </div>

  <a href="/" class="link-muted">Create a new secret</a>
</div>
{% endblock %}
