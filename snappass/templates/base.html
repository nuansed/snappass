<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Tutima SnapPass - Secure Secret Sharing</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Share passwords and secrets through a one-time-use encrypted link">
    <meta name="theme-color" content="#0a0e1a">
    <style>
      /* -- Reset & Base -------------------------------- */
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      :root {
        --bg:         #0a0e1a;
        --bg-card:    #131825;
        --bg-input:   #0d1117;
        --border:     #1e293b;
        --border-focus:#6366f1;
        --text:       #e2e8f0;
        --text-dim:   #94a3b8;
        --text-muted: #64748b;
        --accent:     #6366f1;
        --accent-hover:#818cf8;
        --success:    #10b981;
        --success-bg: rgba(16,185,129,0.08);
        --warning:    #f59e0b;
        --warning-bg: rgba(245,158,11,0.08);
        --danger:     #ef4444;
        --radius:     12px;
        --radius-sm:  8px;
        --shadow:     0 4px 24px rgba(0,0,0,0.3);
        --font:       -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        --mono:       'SF Mono', 'Fira Code', 'Cascadia Code', 'JetBrains Mono', Menlo, Consolas, monospace;
      }

      html { min-height: 100%; }
      body {
        font-family: var(--font);
        background: var(--bg);
        color: var(--text);
        line-height: 1.6;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        -webkit-font-smoothing: antialiased;
      }

      /* -- Layout --------------------------------------- */
      .wrapper {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem 1rem;
      }

      .card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        width: 100%;
        max-width: 560px;
        padding: 2.5rem;
      }

      /* -- Header / Brand ------------------------------- */
      .brand {
        text-align: center;
        margin-bottom: 2rem;
        text-decoration: none;
        display: block;
      }
      .brand:hover { opacity: 0.9; }
      .brand-icon {
        width: 48px;
        height: 48px;
        margin: 0 auto 0.75rem;
        display: block;
      }
      .brand-name {
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--text);
        letter-spacing: -0.02em;
      }
      .brand-tag {
        font-size: 0.8125rem;
        color: var(--text-muted);
        margin-top: 0.25rem;
      }

      /* -- Trust Bar ------------------------------------ */
      .trust-bar {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.625rem;
        margin-bottom: 1.75rem;
        padding: 0.625rem 1rem;
        background: rgba(99,102,241,0.06);
        border: 1px solid rgba(99,102,241,0.12);
        border-radius: var(--radius-sm);
        max-width: 560px;
        width: 100%;
        text-decoration: none;
      }
      .trust-bar:hover {
        background: rgba(99,102,241,0.1);
        text-decoration: none;
      }
      .trust-bar-logo {
        height: 20px;
      }
      .trust-bar-sep {
        width: 1px;
        height: 16px;
        background: rgba(99,102,241,0.25);
      }
      .trust-bar-label {
        font-size: 0.75rem;
        font-weight: 500;
        color: var(--text-dim);
        letter-spacing: 0.01em;
      }

      /* -- Typography ----------------------------------- */
      h1 {
        font-size: 1.25rem;
        font-weight: 600;
        margin-bottom: 0.5rem;
        letter-spacing: -0.01em;
      }
      .subtitle {
        color: var(--text-dim);
        font-size: 0.875rem;
        margin-bottom: 1.5rem;
      }

      /* -- Form Elements -------------------------------- */
      textarea, input[type="text"], input[readonly] {
        width: 100%;
        background: var(--bg-input);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        color: var(--text);
        font-family: var(--font);
        font-size: 0.875rem;
        padding: 0.875rem 1rem;
        transition: border-color 0.2s, box-shadow 0.2s;
        resize: vertical;
        outline: none;
      }
      textarea:focus, input[type="text"]:focus {
        border-color: var(--border-focus);
        box-shadow: 0 0 0 3px rgba(99,102,241,0.15);
      }
      textarea::placeholder { color: var(--text-muted); }

      input[readonly] {
        font-family: var(--mono);
        font-size: 0.8125rem;
        cursor: text;
        color: var(--text-dim);
        background: var(--bg);
      }

      .textarea-mono {
        font-family: var(--mono);
        font-size: 0.8125rem;
        line-height: 1.7;
      }

      /* -- TTL Selector (pill group) -------------------- */
      .ttl-group {
        display: flex;
        gap: 0;
        margin: 1.25rem 0 1.5rem;
        border-radius: var(--radius-sm);
        overflow: hidden;
        border: 1px solid var(--border);
      }
      .ttl-group label {
        flex: 1;
        text-align: center;
        padding: 0.625rem 0.5rem;
        font-size: 0.8125rem;
        font-weight: 500;
        color: var(--text-dim);
        cursor: pointer;
        background: var(--bg-input);
        border-right: 1px solid var(--border);
        transition: background 0.2s, color 0.2s;
        user-select: none;
      }
      .ttl-group label:last-child { border-right: none; }
      .ttl-group label:hover { background: var(--bg-card); color: var(--text); }
      .ttl-group input[type="radio"] { display: none; }
      .ttl-group input[type="radio"]:checked + label {
        background: var(--accent);
        color: #fff;
      }

      .ttl-label {
        font-size: 0.75rem;
        color: var(--text-muted);
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-bottom: 0.5rem;
      }

      /* -- Buttons -------------------------------------- */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        font-family: var(--font);
        font-size: 0.9375rem;
        font-weight: 600;
        border: none;
        border-radius: var(--radius-sm);
        padding: 0.875rem 1.5rem;
        cursor: pointer;
        transition: transform 0.15s, box-shadow 0.15s, background 0.2s;
        outline: none;
        text-decoration: none;
      }
      .btn:active { transform: scale(0.98); }

      .btn-primary {
        background: var(--accent);
        color: #fff;
        width: 100%;
        box-shadow: 0 2px 12px rgba(99,102,241,0.25);
      }
      .btn-primary:hover {
        background: var(--accent-hover);
        box-shadow: 0 4px 20px rgba(99,102,241,0.35);
      }

      .btn-reveal {
        background: var(--warning);
        color: #000;
        width: 100%;
        box-shadow: 0 2px 12px rgba(245,158,11,0.25);
        font-size: 1rem;
        padding: 1rem 1.5rem;
      }
      .btn-reveal:hover {
        background: #fbbf24;
        box-shadow: 0 4px 20px rgba(245,158,11,0.35);
      }

      .btn-copy {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--text-dim);
        padding: 0.625rem 1rem;
        font-size: 0.8125rem;
        border-radius: var(--radius-sm);
      }
      .btn-copy:hover { border-color: var(--text-muted); color: var(--text); }
      .btn-copy.copied {
        border-color: var(--success);
        color: var(--success);
        background: var(--success-bg);
      }

      /* -- URL Display ---------------------------------- */
      .url-row {
        display: flex;
        gap: 0.5rem;
        align-items: stretch;
        margin: 1rem 0;
      }
      .url-row input { flex: 1; min-width: 0; }

      /* -- Info Boxes ----------------------------------- */
      .info-box {
        display: flex;
        align-items: flex-start;
        gap: 0.75rem;
        padding: 1rem;
        border-radius: var(--radius-sm);
        font-size: 0.8125rem;
        line-height: 1.5;
      }
      .info-box svg { flex-shrink: 0; margin-top: 1px; }

      .info-warning {
        background: var(--warning-bg);
        border: 1px solid rgba(245,158,11,0.2);
        color: var(--warning);
      }
      .info-success {
        background: var(--success-bg);
        border: 1px solid rgba(16,185,129,0.2);
        color: var(--success);
      }
      .info-muted {
        background: rgba(100,116,139,0.08);
        border: 1px solid rgba(100,116,139,0.15);
        color: var(--text-dim);
      }
      .info-danger {
        background: rgba(239,68,68,0.08);
        border: 1px solid rgba(239,68,68,0.2);
        color: var(--danger);
      }

      /* -- How It Works --------------------------------- */
      .steps {
        display: flex;
        gap: 1rem;
        margin-top: 2.5rem;
        padding-top: 1.5rem;
        border-top: 1px solid var(--border);
      }
      .step {
        flex: 1;
        text-align: center;
      }
      .step-num {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: rgba(99,102,241,0.12);
        color: var(--accent);
        font-size: 0.75rem;
        font-weight: 700;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 0.5rem;
      }
      .step-title {
        font-size: 0.75rem;
        font-weight: 600;
        color: var(--text);
        margin-bottom: 0.25rem;
      }
      .step-desc {
        font-size: 0.6875rem;
        color: var(--text-muted);
        line-height: 1.4;
      }

      /* -- Deleted Notice ------------------------------- */
      .deleted-notice {
        text-align: center;
        margin-top: 1.5rem;
        padding-top: 1.25rem;
        border-top: 1px solid var(--border);
      }
      .deleted-notice p {
        font-size: 0.8125rem;
        color: var(--text-muted);
        line-height: 1.5;
      }

      /* -- Links ---------------------------------------- */
      a { color: var(--accent); text-decoration: none; }
      a:hover { color: var(--accent-hover); text-decoration: underline; }

      .link-muted {
        color: var(--text-muted);
        font-size: 0.8125rem;
        text-align: center;
        display: block;
        margin-top: 1.5rem;
      }
      .link-muted:hover { color: var(--text-dim); }

      /* -- Footer --------------------------------------- */
      .footer {
        text-align: center;
        padding: 1.5rem 1rem;
        font-size: 0.6875rem;
        color: var(--text-muted);
      }
      .footer a { color: var(--text-muted); }
      .footer a:hover { color: var(--text-dim); }
      .footer-brand {
        margin-bottom: 0.25rem;
        font-size: 0.75rem;
        color: var(--text-dim);
      }
      .footer-brand a {
        color: var(--text-dim);
        font-weight: 500;
      }
      .footer-brand a:hover { color: var(--text); }

      /* -- Responsive ----------------------------------- */
      @media (max-width: 480px) {
        .card { padding: 1.75rem 1.25rem; }
        .steps { flex-direction: column; gap: 0.75rem; }
        .step { text-align: left; display: flex; gap: 0.75rem; align-items: flex-start; }
        .step-num { flex-shrink: 0; }
        .ttl-group label { padding: 0.5rem 0.25rem; font-size: 0.75rem; }
      }

      /* -- Animations ----------------------------------- */
      @keyframes fadeUp {
        from { opacity: 0; transform: translateY(12px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      .card { animation: fadeUp 0.4s ease-out; }

      @keyframes checkPop {
        0%   { transform: scale(0); opacity: 0; }
        60%  { transform: scale(1.15); }
        100% { transform: scale(1); opacity: 1; }
      }
      .check-icon { animation: checkPop 0.4s ease-out 0.1s both; }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <a href="https://www.tutima.com" class="trust-bar" target="_blank" rel="noopener">
        <img src="{{ url_for('static', filename='snappass/img/tutima-logo-white.png') }}" alt="Tutima" class="trust-bar-logo">
        <span class="trust-bar-sep"></span>
        <span class="trust-bar-label">Secure tool by Tutima</span>
      </a>

      <a href="/" class="brand">
        <svg class="brand-icon" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="48" height="48" rx="12" fill="rgba(99,102,241,0.12)"/>
          <path d="M24 14a6 6 0 0 0-6 6v4h-1a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1v-4a6 6 0 0 0-6-6zm-3 10v-4a3 3 0 1 1 6 0v4h-6zm4 7v3h-2v-3a1.5 1.5 0 1 1 2 0z" fill="#6366f1"/>
        </svg>
        <div class="brand-name">SnapPass</div>
        <div class="brand-tag">One-time encrypted secret sharing</div>
      </a>

      {% block content %}{% endblock %}
    </div>

    <footer class="footer">
      <div class="footer-brand">A secure service by <a href="https://www.tutima.com" target="_blank" rel="noopener">Tutima Glashutte/Sa.</a></div>
      End-to-end encrypted &middot; Secrets auto-delete after viewing or expiry
    </footer>

    {% block js %}{% endblock %}
  </body>
</html>
