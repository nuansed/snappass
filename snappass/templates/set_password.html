{% extends "base.html" %}

{% block content %}
<div class="card">
  <h1>Share a secret</h1>
  <p class="subtitle">Paste a password, token, or note. We'll give you a one-time link.</p>

  <form id="password_create" method="post" autocomplete="off">
    <textarea
      rows="6"
      id="password"
      name="password"
      autofocus
      placeholder="Paste your secret here..."
      autocomplete="off"
      required
    ></textarea>

    <div class="ttl-label">Expires after</div>
    <div class="ttl-group">
      <input type="radio" name="ttl" value="Hour" id="ttl-hour">
      <label for="ttl-hour">1 hour</label>
      <input type="radio" name="ttl" value="Day" id="ttl-day">
      <label for="ttl-day">1 day</label>
      <input type="radio" name="ttl" value="Week" id="ttl-week" checked>
      <label for="ttl-week">1 week</label>
      <input type="radio" name="ttl" value="Two Weeks" id="ttl-2weeks">
      <label for="ttl-2weeks">2 weeks</label>
    </div>

    <button type="submit" class="btn btn-primary">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 2a4 4 0 0 0-4 4v2.67A1.33 1.33 0 0 0 2.67 10v3.33A1.33 1.33 0 0 0 4 14.67h8a1.33 1.33 0 0 0 1.33-1.34V10A1.33 1.33 0 0 0 12 8.67V6a4 4 0 0 0-4-4zM6 6a2 2 0 1 1 4 0v2.67H6V6z" fill="currentColor"/></svg>
      Create secret link
    </button>
  </form>

  <div class="steps">
    <div class="step">
      <div class="step-num">1</div>
      <div>
        <div class="step-title">Paste</div>
        <div class="step-desc">Enter your secret and pick an expiry</div>
      </div>
    </div>
    <div class="step">
      <div class="step-num">2</div>
      <div>
        <div class="step-title">Share</div>
        <div class="step-desc">Send the one-time link to your recipient</div>
      </div>
    </div>
    <div class="step">
      <div class="step-num">3</div>
      <div>
        <div class="step-title">Done</div>
        <div class="step-desc">Link self-destructs after one view</div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
